[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probecost"
version = "0.1.0"
description = "What the profiler cost, and what its output entitles you to say -- the same probe at 1.00x and 179x, a run that measured nothing and reported a number, and 17 kernels sharing one name"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "liu-perf" }]
keywords = ["gpu", "cuda", "profiling", "nsight", "ncu", "nsys", "observer-effect",
            "benchmarking", "methodology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
# Zero runtime dependencies. Producing data/ needed a GPU, Nsight Systems and
# Nsight Compute; re-deriving every conclusion from it is arithmetic over
# committed JSON and needs none of them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/liu-perf/probecost"
Documentation = "https://liu-perf.github.io/probecost/"

[project.scripts]
probecost = "probecost.cli:main"

[tool.setuptools]
packages = ["probecost"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Same set as the other sixteen repositories in this series.
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
